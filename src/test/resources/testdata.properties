# Test data for the negative login scenarios (LoginTest). All values below - including the
# expected error/validation strings - were verified live against accounts.joveo.com/login on
# 2026-08-11, so tests fail loudly if the application's copy/behavior ever changes.

invalid.password=WrongPassword@999
unregistered.email=nonexistent.qa.user.98213@example.com
malformed.email=not-an-email

# Generic server-side error shown for: wrong password, unregistered email, and (per a real
# app quirk confirmed via network trace) an empty-email+empty-password submit as well - that
# specific combination is not blocked client-side and instead reaches the login API, which
# returns HTTP 400 and the same generic message. Scenarios 4 and 5 (exactly one field empty)
# ARE blocked client-side and show the field-specific messages below instead.
error.genericLogin=The username or password you entered is incorrect. Try again or reset your password.

# Client-side field validation messages (MUI/Formik), shown without any network call.
error.emailFormat=Please enter a valid email address
error.emailRequired=Email is required
error.passwordRequired=Password is required

# ---------------------------------------------------------------------------------------------
# Branding Hub / Brand creation wizard test data (BrandingHubTest). Verified LIVE on 2026-08-11
# against the real Branding Hub, using the same authorized test account LoginTest uses - except
# where a value is explicitly marked TODO/UNRESOLVED below, which callouts remain because live
# testing found no matching real behavior to confirm against (see the referenced page class's
# comments in src/main/java/pages/branding/ for the full explanation of each).

# Verified live: "Test Brand" genuinely exists in this test account today.
branding.existingBrandName=Test Brand

# Brand names created by this suite are suffixed with a run id at test time (see
# BrandingHubTest.uniqueBrandName()) so reruns never collide with a brand left over from a
# previous run; this is just the human-readable prefix.
branding.newBrandNamePrefix=QA Automated Brand

# UNRESOLVED (see BasicDetailsStepPage's class comment): entering an existing brand name produced
# NO inline validation error at all during live testing - Next still enabled and advanced past
# Step 1. This value is kept only as a fallback guess; TC_03 as currently written does not match
# observed behavior.
error.brandNameExists=A brand with this name already exists

# Verified live: real defaults for the Typography step's two dropdowns - matched the original guess exactly.
branding.typography.defaultFont=Roboto
branding.typography.defaultHeading=Heading H3

# Verified live: both are real, selectable options in their respective dropdowns.
branding.typography.alternateFont=Open Sans
branding.typography.alternateHeading=Heading H1

# Verified live: the real 7 default color sections and their default HEX values (NOT the
# originally guessed background/surface/text sections, which don't exist). Keys here are
# lowercased versions of ColorsStepPage.DEFAULT_SECTION_KEYS (Primary, Secondary, Gray, Success,
# Error, Info, Warning) - BrandingHubTest lowercases each key before this lookup.
branding.color.primary.defaultHex=#3A86FF
branding.color.secondary.defaultHex=#FFB33A
branding.color.gray.defaultHex=#9FA6B2
branding.color.success.defaultHex=#388e3c
branding.color.error.defaultHex=#E35141
branding.color.info.defaultHex=#2196F3
branding.color.warning.defaultHex=#f57c00

# Deterministic replacement colors used by TC_26/TC_28 when changing Primary/Secondary via their
# main swatch - not claimed to be real defaults, just fixed target values so the assertion has a
# known expected HEX to check against.
branding.color.primary.replacementHex=#8E2DE2
branding.color.secondary.replacementHex=#FF6B35

# Deliberately malformed HEX used by TC_30 to confirm the picker/field rejects bad input instead
# of crashing or corrupting the previously-displayed value.
branding.color.invalidHex=ZZZZZZ

# Verified live: default Edges value is genuinely 4. targetEdgeValue=8 is only ever reached via
# direct numeric entry in the test flow, not via +/- clicks, so it is unaffected by the
# increment-step-size inconsistency noted below.
branding.style.defaultEdgeValue=4
branding.style.targetEdgeValue=8

# UNRESOLVED (see StyleStepPage's class comment): a live increment click was observed to jump the
# value by +2 once and by +1 the next time, rather than a fixed step - and the real min/max
# boundaries were never actually reached live. These remain unconfirmed placeholder guesses.
branding.style.edgeMin=0
branding.style.edgeMax=20

